name: Non-Answers PR verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/non-answers/**'
      - 'src/pages/index.astro'
      - 'src/pages/blog/index.astro'
      - 'scripts/check-overflow.mjs'
      - 'src/pages/critical-inquiry/**'
      - 'src/styles/critical-inquiry.css'
      - 'src/pages/research.astro'
      - 'src/components/Footer.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'scripts/validate-critical-hub.mjs'
      - 'research/critical-inquiry/**'
      - 'scripts/validate-li-wenliang-research.mjs'
      - 'package.json'
      - 'scripts/generate-non-answers-og.mjs'
      - 'scripts/check-non-answers-p13.mjs'
      - '.github/workflows/non-answers-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro / verify base paths
        run: npm run build

      - name: Validate build, content, and project tests
        run: |
          npm run validate
          npm run validate:content
          npm run test:contributions

      - name: Verify release-safe critical inquiry hub
        run: npm run test:critical-hub

      - name: Validate Li Wenliang critical inquiry chronology and as-of boundaries
        run: node scripts/validate-li-wenliang-research.mjs

      - name: Install Chromium for layout checks
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Desktop and mobile overflow checks
        run: npm run check:overflow

      - name: Upload critical inquiry visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: critical-inquiry-visual-qa
          path: .astro/contribution-review/critical-inquiry*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify integrated feature and research data
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const html = readFileSync('dist/non-answers/index.html', 'utf8');
          const required = [
            'adjudicated_139.csv', 'source_manifest_18.csv',
            'document_quality_18.csv', 'document_dictionary_counts_18.csv',
            'dictionary_v0_4_frozen.json', 'FROZEN_SELECTION_PROTOCOL.md',
            'D2_3_FINDINGS.md', 'CODEBOOK_V0_5.md', 'change_log.csv',
          ];
          for (const name of required) {
            if (!existsSync('dist/non-answers/' + name)) throw new Error('Missing: ' + name);
            if (!html.includes(name)) throw new Error('Article not linked: ' + name);
          }
          const expectedUrl = 'https://gbx-max1220.github.io/maxguo.dev/non-answers/';
          if (!html.includes(expectedUrl)) throw new Error('Canonical URL missing');
          const home = readFileSync('dist/index.html', 'utf8');
          const blog = readFileSync('dist/blog/index.html', 'utf8');
          for (const [name, text] of [['homepage',home],['blog',blog]]) {
            if (!text.includes('/maxguo.dev/non-answers/')) throw new Error(name + ' link missing base');
          }
          const png = readFileSync('dist/non-answers/og-preview.png');
          if (png.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a' ||
              png.readUInt32BE(16) !== 1200 || png.readUInt32BE(20) !== 630) {
            throw new Error('Dedicated OG cover is missing or malformed');
          }
          const ogCover = expectedUrl + 'og-preview.png';
          if (!html.includes(ogCover)) throw new Error('Dedicated OG meta URL missing');
          console.log('Non-Answers artifact, OG cover, canonical and entrypoint checks PASSED');
          NODE

      - name: Verify V1.8 youth-unemployment published case
        run: node scripts/check-non-answers-v1-8.mjs

      - name: Verify P13 trilingual question-compression short case
        run: node scripts/check-non-answers-p13.mjs

      - name: Capture V1.8 mobile and desktop visual QA
        run: node scripts/capture-non-answers-v1-8.mjs

      - name: Upload V1.8 visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: non-answers-v1-8-visual-qa
          path: .astro/non-answers-v1-8-review/
          if-no-files-found: error
          retention-days: 7

      - name: Upload P13 draft-case visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: non-answers-p13-draft-visual-qa
          path: .astro/non-answers-p13-review/
          if-no-files-found: error
          retention-days: 7
