# === Reasonix default pre-commit config ===
# Copy this to your project root as .pre-commit-config.yaml
# Then run: pre-commit install

# ---------------------------------------------------------------------------
# China Time Use 2024 (public/research/china-time-use-2024/) and these hooks
# ---------------------------------------------------------------------------
# That route is published output. It is generated by the research project's own tools, and
# every file it ships is hash-pinned by the reproduction pack inside it
# (research-pack/tools/verify_public_inputs.py and manifest/PACK_HASHES.json). If a hook
# rewrites one of those bytes, the pack's integrity check starts pointing at content that no
# longer exists and the reader's reproduction fails - so "the formatter fixed it" and "the
# release is intact" cannot both be true.
#
# The exclusions below are per-hook, and each one is a measurement rather than a guess. Every
# hook was run over this exact content in a clone whose exclusions were deleted
# (2026-10-13, pre-commit 4.6.0, 65 route files; see PRE_COMMIT_HOOK_MEASUREMENT.md):
#
#   ruff               rewrote 1 route file, 19 style findings in route Python  -> EXCLUDED (route)
#   ruff-format        rewrote 6 route files, +958/-285 pure formatting         -> EXCLUDED (route)
#   prettier           rewrote 23 route files (html/css/md/json)                -> EXCLUDED (route)
#   end-of-file-fixer  rewrote 4 route files, all vendored API records          -> EXCLUDED (that folder only)
#   trailing-whitespace   rewrote 0 route files                                 -> ACTIVE on the route
#   mixed-line-ending     rewrote 0 route files (route is LF-canonical)         -> ACTIVE on the route
#   check-json            passes over every route JSON                          -> ACTIVE on the route
#   check-merge-conflict  passes                                      -> ACTIVE   on the route
#   detect-private-key    passes                                      -> ACTIVE   on the route
#   check-yaml            no route file is YAML                       -> ACTIVE   on the site
#   check-toml            no route file is TOML ("no files to check") -> ACTIVE   on the site
#
# The read-only safety and validity checks therefore stay switched on for the research route,
# and the two fixing hooks that provably have nothing to fix there stay on as well: pre-commit
# aborts a commit when a hook rewrites a file, so those two act as a guard that a future route
# regeneration which drifts from the pack's own whitespace and line-ending rules is caught at
# the commit instead of shipping. Nothing here disables a check for the whole repository.
#
# Disclosed rather than silenced: the research scripts are not ruff-clean (E702 semicolon-joined
# statements, E741 ambiguous name `l`, F541 f-string without placeholders). Normalising them
# would rewrite published, hash-pinned research code, so that is left as a separate decision for
# the feature owner and is not folded into a release PR.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^public/research/china-time-use-2024/
      - id: ruff-format
        exclude: ^public/research/china-time-use-2024/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # raw bodies fetched from the Crossref and Nature endpoints, kept byte-for-byte as the
        # API returned them; the evidence manifest pins exactly those bytes
        exclude: ^public/research/china-time-use-2024/research-pack/evidence/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown, css, html]
        exclude: ^public/research/china-time-use-2024/
