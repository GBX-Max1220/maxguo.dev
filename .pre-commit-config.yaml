# === Reasonix default pre-commit config ===
# Copy this to your project root as .pre-commit-config.yaml
# Then run: pre-commit install

# The China Time Use 2024 research feature is published as a static drop-in route whose
# bytes are pinned by its own offline reproduction pack (research-pack/README.md and
# tools/verify_public_inputs.py hash every shipped file). ruff / ruff-format /
# end-of-file-fixer / mixed-line-ending / prettier rewrite those files, which after the
# fact makes the pack's pinned hashes point at bytes that no longer exist — i.e. the
# reader's reproduction check fails. Treat the route as generated/vendored output and
# keep it out of the formatters; everything else in this repository is unaffected.
exclude: ^public/research/china-time-use-2024/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown, css, html]
