spute","start":"What readers saw first","step1":"01 / News brief","intro1":"Imagine seeing only a short news report. The passage below is our paraphrase, not a verbatim reproduction.","briefLabel":"CCTV News, republished by CRI · 17:34","brief":"A journalist asked whether China would release the recording of a call with a Philippine military official, and asked for an account of the matter.","guessTitle":"From the brief alone, which specific requests do you think the reporter made?","hint":"Select any. Choices stay within this page; nothing is uploaded.","qA":"Whether the recording would be released","qB":"A date or time for its release","qC":"The name redacted from a transcript","reveal":"Reveal the three requests in the full record","collapse":"Hide the full question","fullLabel":"Full Foreign Ministry transcript · 18:20","fullLead":"The Bloomberg journalist made three separately testable requests (paraphrased):","A":"A / Will it be released?","Ad":"Does China intend to release the audio?","B":"B / When?","Bd":"If so, when might that happen?","C":"C / The redacted name","Cd":"Who is the person whose name was redacted in the transcript?","yourRead":"Your initial reading","yourReadMore":"You selected {n} requests; {seen} were visible as specific questions in the brief. The full record contains all three.","compareNote":"This demonstrates a difference between two published texts, not why an editor shortened one, and not a measured effect on actual readers.","step2":"02 / Answer coverage","s2title":"Does seeing a question mean getting its answer?","s2intro":"The 8 May response referred to earlier statements and information published by the embassy, and asserted that the evidence was clear. Classify how it addressed each request.","coverage":"How do you classify the response?","choose":"Choose one","direct":"Directly answered","related":"Related information, not a direct answer","none":"Requested detail not supplied","check":"Compare with editorial assessment","reset":"Reset classifications","resultTitle":"Request-by-request assessment","statusA":"A: It referred to earlier disclosures, but did not explicitly confirm whether full audio would be released later.","statusB":"B: No future release time was given.","statusC":"C: The requested name was not provided.","count":"Your reading matched the editorial assessment on {match}/3 requests. A difference is not automatically an error: review the linked sources.","judgment":"We assess whether **this answer supplied the requested information**, not the authenticity of any recording.","s2caveat":"Contemporary reporting described excerpts played for some media and a circulating transcript. The 8 May response alone cannot justify saying that no material was disclosed anywhere.","step3":"03 / Transmission and a counterexample","s3title":"Why is a news brief not the full briefing?","s3intro":"First compare publication timestamps, then examine another report by the same broadcaster. A later-published official transcript cannot be assumed to be the source the earlier brief edited.","t1":"15:40 · Beijing Daily app","t1d":"An earlier summary also condensed the question to whether audio would be released and a request for background. Similar wording does not establish who copied whom.","t2":"17:34 · CCTV News via CRI","t2d":"The report mentioned release of the audio but did not reproduce the requested timing or redacted name.","t3":"18:20 · Foreign Ministry website","t3d":"The posted transcript included all three requests. Page publication time is not the time the journalist actually spoke.","controlTitle":"Counterexample: CCTV News has also preserved multipart questions","control":"On 22 September 2025, a CCTV News brief retained separate questions about an American H‑1B fee, Chinese talent policies, and possible new plans. One 2024 brief cannot establish a universal editing practice.","step4":"04 / What the evidence supports","s4title":"The textual difference is documented. Motives and audience const localeKeys=['zh','tw','en'];let lang='zh';const state={revealed:false,judged:false};
const format=(value,map)=>Object.entries(map).reduce((s,[k,v])=>s.replaceAll('{'+k+'}',String(v)),value);
function translate(){const d=translations[lang];for(const el of document.querySelectorAll('[data-i]'))el.textContent=d[el.dataset.i];for(const x of document.querySelectorAll('[data-lang]'))x.setAttribute('aria-pressed',String(x.dataset.lang===lang));document.documentElement.lang=({zh:'zh-CN',tw:'zh-Hant',en:'en'})[lang];document.title=d.title.replaceAll('\n',' ')+' | The Language of Non-Answers';document.getElementById('revealBtn').textContent=d[state.revealed?'collapse':'reveal'];for(const select of document.querySelectorAll('[data-judge]')){const value=select.value;select.innerHTML='<option value="">'+d.choose+'</option>'+['direct','related','none'].map(k=>'<option value="'+k+'">'+d[k]+'</option>').join('');select.value=value}document.getElementById('full').classList.toggle('visible',state.revealed);document.getElementById('revealBtn').setAttribute('aria-expanded',String(state.revealed));document.getElementById('eval').classList.toggle('visible',state.judged);updateInitial();updateScore();}
function updateInitial(){const checks=[...document.querySelectorAll('[data-initial]')];const selected=checks.filter(x=>x.checked);document.getElementById('initialResult').textContent=state.revealed?format(translations[lang].yourReadMore,{n:selected.length,seen:selected.filter(x=>x.dataset.initial==='A').length}):'';}
function updateScore(){const correct={A:'related',B:'none',C:'none'};const choices=[...document.querySelectorAll('[data-judge]')];const match=choices.filter(x=>x.value===correct[x.dataset.judge]).length;document.getElementById('score').textContent=format(translations[lang].count,{match});}
function switchLang(next){if(!localeKeys.includes(next))return;lang=next;translate();const url=new URL(location.href);url.searchParams.set('lang',next==='tw'?'zh-Hant':next);try{history.replaceState({},'',url)}catch(_){}}
for(const b of document.querySelectorAll('[data-lang]'))b.addEventListener('click',()=>switchLang(b.dataset.lang));
document.getElementById('revealBtn').addEventListener('click',()=>{state.revealed=!state.revealed;translate()});
document.getElementById('assessBtn').addEventListener('click',()=>{state.judged=true;translate();document.getElementById('eval').scrollIntoView({block:'nearest',behavior:'smooth'})});
document.getElementById('resetBtn').addEventListener('click',()=>{for(const s of document.querySelectorAll('[data-judge]'))s.value='';state.judged=false;translate()});
document.getElementById('resetAll').addEventListener('click',()=>{for(const s of document.querySelectorAll('select'))s.value='';for(const c of document.querySelectorAll('[data-initial]'))c.checked=false;state.revealed=false;state.judged=false;translate();window.scrollTo({top:0,behavior:'smooth'})});
for(const c of document.querySelectorAll('[data-initial]'))c.addEventListener('change',updateInitial);
for(const s of document.querySelectorAll('select'))s.addEventListener('change',()=>{if(state.judged)updateScore()});
const initial=new URL(location.href).searchParams.get('lang');lang=initial==='zh-Hant'||initial==='tw'?'tw':initial==='en'?'en':'zh';translate();
</script></body></html>
